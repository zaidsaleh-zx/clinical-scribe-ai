name: Python CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: ruff check --select E4,E7,E9,F --ignore E402 backend/auth.py backend/order_routing.py backend/models.py tests
      - run: python scripts/sync_hf_space.py
