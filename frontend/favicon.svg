    <circle cx="18.4" cy="12.5" r="2.25" stroke="#3ECEB2" stroke-width="0.8" fill="rgba(62,206,178,0.08)"/>
    <circle cx="23.6" cy="12.5" r="2.25" stroke="#3ECEB2" stroke-width="0.8" fill="rgba(62,206,178,0.08)"/>
    <path d="M20.65 12.5h0.7" stroke="#3ECEB2" stroke-width="0.8" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="18.4" cy="12.6" r="1.1" fill="white"/>
    <circle cx="23.6" cy="12.6" r="1.1" fill="white"/>
    <circle cx="18.5" cy="12.7" r="0.55" fill="#2F2B39"/>
