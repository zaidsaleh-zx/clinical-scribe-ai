    <circle cx="21" cy="26.6" r="0.55" fill="#B9CBD8"/>
    <circle cx="21" cy="29.6" r="0.55" fill="#B9CBD8"/>
    <!-- Pocket with pen -->
    <rect x="23.6" y="24.8" width="4.2" height="4.6" rx="0.6" fill="none" stroke="#C9D6DF" stroke-width="0.65"/>
    <path d="M25.3 24.8v-1.7l0.5-0.6 0.5 0.6v1.7" stroke="#5B8DEF" stroke-width="0.7" fill="none"/>
    <!-- Green medical aid cross on coat -->
    <path d="M16.4 22.3h1.2v4.3h-1.2zM14.8 23.9h3.6v1.2h-3.6z" fill="#2CA98F"/>
