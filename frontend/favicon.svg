    <path d="M17.3 10.2c0.6-0.4 1.3-0.4 1.9 0" stroke="#3A3238" stroke-width="0.65" fill="none" stroke-linecap="round"/>
    <path d="M22.8 10.2c0.6-0.4 1.3-0.4 1.9 0" stroke="#3A3238" stroke-width="0.65" fill="none" stroke-linecap="round"/>
