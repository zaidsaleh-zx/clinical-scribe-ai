      <stop offset="45%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>
  <rect x="1.5" y="1.5" width="39" height="39" rx="11.5" fill="url(#logoBg)"/>
  <rect x="1.5" y="1.5" width="39" height="39" rx="11.5" fill="url(#logoBadge)"/>
  <rect x="3" y="3" width="36" height="36" rx="9.5" stroke="rgba(255,255,255,0.32)" stroke-width="1.4" fill="none"/>
