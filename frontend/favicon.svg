    <path d="M20.9 21.8c-2.8 0.7-5 3.1-5 6 0 2.8 2.2 5 5 5 1.3 0 2.5-0.4 3.5-1.2" stroke="#2EC4B0" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Stethoscope chest piece (diaphragm) -->
    <path d="M24.4 31.5l1.2-0.9" stroke="#2EC4B0" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="26" cy="30.8" r="3" fill="#CBD6DE" stroke="#E5EDF3" stroke-width="0.7"/>
    <circle cx="26" cy="30.8" r="2" fill="#2EC4B0"/>
    <circle cx="26" cy="30.8" r="0.8" fill="#1B9F8B"/>
