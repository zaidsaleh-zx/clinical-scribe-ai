    <path d="M14.4 11.8c-1.1 0.6-1.8 1.7-1.8 3 0 2.2 1.4 4.1 3.2 5.3" stroke="#9AA9B4" stroke-width="1.1" fill="none" stroke-linecap="round"/>
    <path d="M27.6 11.8c1.1 0.6 1.8 1.7 1.8 3 0 2.2-1.4 4.1-3.2 5.3" stroke="#9AA9B4" stroke-width="1.1" fill="none" stroke-linecap="round"/>
