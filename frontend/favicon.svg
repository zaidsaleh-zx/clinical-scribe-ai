<svg width="64" height="64" viewBox="0 0 42 42" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoBg" x1="2" y1="2" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3ECEB2"/>
      <stop offset="55%" stop-color="#2CA98F"/>
      <stop offset="100%" stop-color="#7B5FC9"/>
    </linearGradient>
    <linearGradient id="logoBadge" x1="0" y1="0" x2="1" y2="1">
